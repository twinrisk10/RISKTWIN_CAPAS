[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georisk_twin_hev"
version = "0.1.0"
description = "Contrato común H–E–V y API mínima del gemelo digital RISKTWIN (SIS-API-01, complemento de auditoría)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2", "pandas>=2", "numpy"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
